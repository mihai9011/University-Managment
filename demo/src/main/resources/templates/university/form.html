<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add University</title>
</head>
<body>
    <h1>Add a New University</h1>

    <form th:action="@{/universities}" th:object="${university}" method="post">

        <label>Name:</label>
        <input type="text" th:field="*{name}" required />
        <br><br>

        <label>City:</label>
        <input type="text" th:field="*{city}" required />
        <br><br>

        <button type="submit">Save</button>
    </form>

    <br>
    <a th:href="@{/universities}">Back to list</a>
</body>
</html>
