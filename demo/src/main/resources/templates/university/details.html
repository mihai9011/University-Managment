<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>University Details</title>
</head>
<body>
    <h1>University Details</h1>

    <table border="1">
        <tr><th>ID</th><td th:text="${university.id}"></td></tr>
        <tr><th>Name</th><td th:text="${university.name}"></td></tr>
        <tr><th>City</th><td th:text="${university.city}"></td></tr>
    </table>

    <br>
    <a th:href="@{'/universities/' + ${university.id} + '/edit'}">Edit</a>
    <a th:href="@{/universities}">Back to list</a>
</body>
</html>
