<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Teaching Assignment</title>
</head>
<body>
    <h1>Add a New Teaching Assignment</h1>

    <form th:action="@{/teachingassignment}" th:object="${teachingAssignment}" method="post">
        
        <label>ID:</label>
        <input type="text" th:field="*{id}" required />
        <br><br>

        <label>Course ID:</label>
        <input type="text" th:field="*{courseId}" required />
        <br><br>

        <label>Staff ID:</label>
        <input type="text" th:field="*{staffId}" required />
        <br><br>

        <label>Managing Type:</label>
        <select th:field="*{managing}" required>
            <option value="LAB">LAB</option>
            <option value="SEMINAR">SEMINAR</option>
            <option value="COURSE">COURSE</option>
        </select>
        <br><br>

        <button type="submit">Save</button>
    </form>

    <br>
    <a th:href="@{/teachingassignment}">Back to list</a>
</body>
</html>
