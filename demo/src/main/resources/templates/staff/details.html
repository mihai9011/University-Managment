<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff Member Details</title>
</head>
<body>
    <h1>Staff Member Details</h1>

    <table border="1">
        <tr><th>ID</th><td th:text="${staff.id}"></td></tr>
        <tr><th>Name</th><td th:text="${staff.name}"></td></tr>

        <!-- Specific fields if Teacher -->
        <th:block th:if="${staff instanceof T(com.example.universitymanagement.model.Teacher)}">
            <tr><th>Type</th><td>Teacher</td></tr>
            <tr><th>Title</th><td th:text="${staff.title}"></td></tr>
            <tr><th>Department ID</th><td th:text="${staff.departmentId}"></td></tr>
            <tr><th>Email</th><td th:text="${staff.email}"></td></tr>
            <tr><th>Hire Date</th><td th:text="${staff.hireDate}"></td></tr>
        </th:block>

        <!-- Specific fields if Assistant -->
        <th:block th:if="${staff instanceof T(com.example.universitymanagement.model.Assistant)}">
            <tr><th>Type</th><td>Assistant</td></tr>
            <tr><th>Role</th><td th:text="${staff.role}"></td></tr>
        </th:block>
    </table>

    <br>
    <a th:href="@{'/staff/' + ${staff.id} + '/edit'}">Edit</a>
    <a th:href="@{/staff}">Back to list</a>
</body>
</html>
