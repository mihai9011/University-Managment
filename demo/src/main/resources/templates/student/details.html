<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Details</title>
</head>
<body>
    <h1>Student Details</h1>

    <table border="1">
        <tr><th>ID</th><td th:text="${student.id}"></td></tr>
        <tr><th>Name</th><td th:text="${student.name}"></td></tr>
        <tr><th>Email</th><td th:text="${student.email}"></td></tr>
        <tr><th>Birth Date</th><td th:text="${student.birthDate}"></td></tr>
    </table>

    <br>
    <a th:href="@{'/students/' + ${student.id} + '/edit'}">Edit</a>
    <a th:href="@{/students}">Back to list</a>
</body>
</html>
