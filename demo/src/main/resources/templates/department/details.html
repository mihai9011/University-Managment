<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Department Details</title>
</head>
<body>
    <h1>Department Details</h1>

    <table border="1">
        <tr><th>ID</th><td th:text="${department.id}"></td></tr>
        <tr><th>Name</th><td th:text="${department.name}"></td></tr>
        <tr><th>University ID</th><td th:text="${department.universityId}"></td></tr>
    </table>

    <br>
    <a th:href="@{'/departments/' + ${department.id} + '/edit'}">Edit</a>
    <a th:href="@{/departments}">Back to list</a>
</body>
</html>
