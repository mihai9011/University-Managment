<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Room Details</title>
</head>
<body>
    <h1>Room Details</h1>

    <table border="1">
        <tr><th>ID</th><td th:text="${room.id}"></td></tr>
        <tr><th>Number</th><td th:text="${room.number}"></td></tr>
        <tr><th>Capacity</th><td th:text="${room.capacity}"></td></tr>
        <tr><th>University ID</th><td th:text="${room.universityId}"></td></tr>
    </table>

    <br>
    <a th:href="@{'/rooms/' + ${room.id} + '/edit'}">Edit</a>
    <a th:href="@{/rooms}">Back to list</a>
</body>
</html>
