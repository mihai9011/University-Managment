<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Staff List</title>
</head>
<body>
    <h1>Staff Members</h1>
    
    <a th:href="@{/staff/new}">Add a new staff member</a>
    <br><br>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Ensure your controller adds "staffList" to the model -->
            <tr th:each="staff : ${staffList}">
                <td th:text="${staff.id}">1</td>
                <td th:text="${staff.name}">Jane Smith</td>
                <td>
                    <form th:action="@{'/staff/' + ${staff.id} + '/delete'}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
